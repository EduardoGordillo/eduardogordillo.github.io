<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio_EduardoGordillo</title>
    <link rel="shortcut icon" href="/img/index/icon_G.ico">
    <link rel="stylesheet" href="/style/base/base.css">
    <link rel="stylesheet" href="/style/header.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@1,700&family=Montserrat:ital,wght@0,100;1,600&family=Mulish:wght@300;400;700&family=Rubik:ital,wght@1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style/contacto.css">
    <link rel="stylesheet" href="/style/index.css">
    <link rel="stylesheet" href="/style/components/button.css">
    <link rel="stylesheet" href="/style/components/card.css">
    <link rel="stylesheet" href="/style/components/inputs.css">
    <link rel="stylesheet" href="/style/footer.css">
</head>

<body>
    <header>
        <div id="main-header"></div>
    </header>
    <main>
        <section class="contacto">
            <div class="carta__form">
                <h2 class="card__title flex flex--center">Contacto</h2>
                <form action="/screens/registroConcluido.html" class="formulario flex--column">
                    <fieldset>
                        <legend class="form__label">Si necesitas contactarme, ingresa nombre y correo.</legend>
                        <div class="input-container">
                            <input name="name" id="name" class="input" type="text" placeholder="Nombre" required
                                data-tipo="nombre">
                            <label class="input-label" for="name">Nombre</label>
                            <span class="input-message-error">Este campo no es valido</span>
                        </div>
                        <div class="input-container">
                            <input name="email" id="email" class="input" type="email" placeholder="Email" required
                                data-tipo="email">
                            <label class="input-label" for="email">Email</label>
                            <span class="input-message-error">Este campo no es valido</span>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend class="form__label">Para contactarme a la brevedad posible, indica tu fecha de
                            nacimiento y numero telefonico.</legend>
                        <div class="input-container">
                            <input name="birth" id="birth" class="input" type="date" placeholder="Fecha de nacimento"
                                required data-tipo="nacimiento">
                            <label class="input-label" for="birth">Fecha de nacimiento</label>
                            <span class="input-message-error">Este campo no es valido</span>
                        </div>
                        <div class="input-container">
                            <input name="phoneNumber" id="phoneNumber" class="input" type="text"
                                placeholder="Número telefónico" pattern="\d{10}" required minlength="10" maxlength="10"
                                data-tipo="numero">
                            <label class="input-label" for="phoneNumber">Número telefónico</label>
                            <span class="input-message-error">Este campo no es valido</span>
                        </div>
                    </fieldset>
                    <button type="submit" class="button">Contactame!</button>
                </form>
            </div>
            <div class="carta__gif">
                <img class="gif-url" src="/img/contacto/slide10_1.gif" alt="Animación de contacto">
            </div>
        </section>
    </main>
    <footer></footer>

    <script src="https://kit.fontawesome.com/59a418c13a.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script type="module" src="/js/app.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/footer.js"></script>

</body>



</html>
